<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Richer, slightly lighter vibrant Islamic Emerald Gradient -->
    <radialGradient id="bgLighter" cx="50%" cy="32%" r="80%" fx="50%" fy="24%">
      <stop offset="0%" stop-color="#157a63" />
      <stop offset="35%" stop-color="#0d614e" />
      <stop offset="70%" stop-color="#074537" />
      <stop offset="100%" stop-color="#043026" />
    </radialGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="topGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Vibrant Neon Lime Gradient for Arch & Plus -->
    <linearGradient id="limeNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d" />
      <stop offset="30%" stop-color="#a3e635" />
      <stop offset="75%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Inner Arch Soft Ambient Fill -->
    <radialGradient id="archBackdrop" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#064e3b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Mosque Dome Gradient -->
    <radialGradient id="domeShade" cx="44%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Open Book Pages Gradients -->
    <linearGradient id="pageLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Book Underlay Ribbon Base -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Plus (+) Button Glossy Gradient -->
    <linearGradient id="plusGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="45%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Master Drop Shadow Filter -->
    <filter id="mainDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#021c16" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Text Typography Drop Shadow Filter -->
    <filter id="fontShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#021a14" flood-opacity="0.65" />
    </filter>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softLimeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== 1. SQUIRCLE ICON BACKGROUND ==================== -->
  <rect width="512" height="512" rx="118" fill="url(#bgLighter)" />

  <!-- Top Glass Sheen -->
  <rect width="512" height="512" rx="118" fill="url(#topGlass)" />

  <!-- Crisp 1.5px Outer Border Rim -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="115.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.16" />

  <!-- Soft Ambient Lime Glow in Center -->
  <ellipse cx="256" cy="175" rx="135" ry="105" fill="#4ade80" opacity="0.16" filter="url(#softLimeGlow)" />

  <!-- ==================== 2. SACRED EMBLEM (ARCH, DOME & BOOK) ==================== -->
  <g filter="url(#mainDropShadow)">

    <!-- Arch Inner Shadow Backdrop -->
    <path
      d="M 166 242
         V 182
         C 166 136, 198 94, 256 78
         C 314 94, 346 136, 346 182
         V 242
         Z"
      fill="url(#archBackdrop)"
    />

    <!-- Islamic Arch Outline (Thick 3D Beveled Stroke) -->
    <path
      d="M 166 242
         V 182
         C 166 136, 198 94, 256 78
         C 314 94, 346 136, 346 182
         V 242"
      fill="none"
      stroke="url(#limeNeon)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Top-Right Floating Plus (+) Badge -->
    <g transform="translate(358, 138)">
      <!-- Soft ambient glow -->
      <circle cx="0" cy="0" r="22" fill="#4ade80" opacity="0.28" />
      <!-- Vertical bar of + -->
      <rect x="-6.5" y="-21" width="13" height="42" rx="6.5" fill="url(#plusGloss)" />
      <!-- Horizontal bar of + -->
      <rect x="-21" y="-6.5" width="42" height="13" rx="6.5" fill="url(#plusGloss)" />
      <!-- Specular Center Highlight -->
      <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.45" />
    </g>

    <!-- Mosque Dome with 3D Shading -->
    <path
      d="M 210 238
         C 210 184, 238 170, 256 166
         C 274 170, 302 184, 302 238
         Z"
      fill="url(#domeShade)"
    />

    <!-- Dome Finial Base & Spire -->
    <path d="M 253 166 H 259 V 156 H 253 Z" fill="#ffffff" />
    <circle cx="256" cy="156" r="3.5" fill="#f8fafc" />

    <!-- Crescent Finial on Spire (Upward Facing) -->
    <path
      d="M 256 134
         A 11 11 0 0 0 256 156
         A 8.5 8.5 0 0 1 256 139
         Z"
      fill="#ffffff"
    />

    <!-- Open Quran Multi-Layer Structure -->
    <!-- Layer 1: Green Binding Base -->
    <path
      d="M 256 302
         C 220 288, 172 290, 142 266
         L 156 286
         C 188 306, 226 304, 256 314
         C 286 304, 324 306, 356 286
         L 370 266
         C 340 290, 292 288, 256 302
         Z"
      fill="url(#bookCover)"
    />

    <!-- Layer 2: Second Page Trim Highlight (Lime Green) -->
    <path
      d="M 256 293
         C 224 280, 178 282, 146 260
         L 152 270
         C 184 290, 226 290, 256 300
         C 286 290, 328 290, 360 270
         L 366 260
         C 334 282, 288 280, 256 293
         Z"
      fill="#86efac"
    />

    <!-- Layer 3: Left Page (Crisp 3D Cream White) -->
    <path
      d="M 256 290
         C 218 274, 174 276, 144 252
         C 174 238, 220 240, 256 254
         Z"
      fill="url(#pageLeft)"
    />

    <!-- Layer 4: Right Page (Crisp 3D Cream White) -->
    <path
      d="M 256 290
         C 294 274, 338 276, 368 252
         C 338 238, 292 240, 256 254
         Z"
      fill="url(#pageRight)"
    />

    <!-- Center Fold Spine -->
    <path
      d="M 256 254
         L 256 312"
      stroke="#94a3b8"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.5"
    />
  </g>

  <!-- ==================== 3. ULTRA-ATTRACTIVE MODERN "Zikr+" TYPOGRAPHY ==================== -->
  <g filter="url(#fontShadow)">
    <!-- High-end Custom Crafted Modern Rounded Geometric Vectors -->

    <!-- Letter 'Z' (Fluid, bold, beautifully beveled) -->
    <path
      d="M 112 334
         H 176
         C 183 334, 187 338, 187 344
         C 187 348, 184 353, 178 357
         L 137 392
         H 180
         C 186 392, 191 396, 191 402
         C 191 408, 186 412, 180 412
         H 114
         C 107 412, 103 408, 103 402
         C 103 397, 106 392, 112 388
         L 154 352
         H 112
         C 106 352, 101 348, 101 343
         C 101 338, 106 334, 112 334
         Z"
      fill="#ffffff"
    />

    <!-- Letter 'i' (Bold upright pill with playful glowing circular dot) -->
    <!-- Dot of 'i' -->
    <circle cx="210" cy="340" r="9.5" fill="#ffffff" />
    <!-- Stem of 'i' -->
    <rect x="200.5" y="356" width="19" height="56" rx="9.5" fill="#ffffff" />

    <!-- Letter 'k' (Modern, friendly, perfectly proportioned) -->
    <path
      d="M 238 326
         C 238 320, 242 316, 247.5 316
         C 253 316, 257 320, 257 326
         V 370
         L 286 352
         C 291 349, 297 351, 300 356
         C 303 361, 301 367, 296 371
         L 272 386
         L 298 402
         C 303 405, 304 411, 301 416
         C 298 421, 292 422, 287 419
         L 257 400
         V 402.5
         C 257 408, 253 412, 247.5 412
         C 242 412, 238 408, 238 402.5
         Z"
      fill="#ffffff"
    />

    <!-- Letter 'r' (Smooth, expressive rounded arched terminal) -->
    <path
      d="M 318 356
         C 318 350, 322 346, 327.5 346
         C 333 346, 337 350, 337 356
         V 368
         C 343 355, 354 348, 367 350
         C 372 351, 376 355, 375 361
         C 374 366, 370 370, 364 369
         C 351 368, 339 375, 337 388
         V 402.5
         C 337 408, 333 412, 327.5 412
         C 322 412, 318 408, 318 402.5
         Z"
      fill="#ffffff"
    />

    <!-- Symbol '+' (Bright, vibrant Lime-Green Pill Plus beside Zikr) -->
    <g transform="translate(402, 381)">
      <!-- Vertical bar of + -->
      <rect x="-7.5" y="-25" width="15" height="50" rx="7.5" fill="url(#plusGloss)" />
      <!-- Horizontal bar of + -->
      <rect x="-25" y="-7.5" width="50" height="15" rx="7.5" fill="url(#plusGloss)" />
      <!-- Specular center bevel glow -->
      <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.4" />
    </g>
  </g>
</svg>
