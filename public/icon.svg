<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Emerald Forest -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0a4b3c" />
      <stop offset="45%" stop-color="#06382c" />
      <stop offset="85%" stop-color="#03211a" />
      <stop offset="100%" stop-color="#021712" />
    </radialGradient>

    <!-- Arch & Plus Lime Green Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="40%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Darker Green Accent for Book Base -->
    <linearGradient id="bookGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Cream White Gradient for Dome and Book Pages -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f3" />
    </linearGradient>

    <!-- Soft Drop Shadow for Elements -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#01140e" flood-opacity="0.45" />
    </filter>

    <!-- Text Shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Glow for Plus and Accents -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- ==================== ICON ARTWORK (DOME, ARCH, BOOK) ==================== -->
  <g filter="url(#shadow)">
    <!-- 2. Islamic Arch Outline -->
    <!-- Pointed Arch with rounded apex and straight bottom legs -->
    <path
      d="M 164 246
         V 186
         C 164 140, 196 96, 256 82
         C 316 96, 348 140, 348 186
         V 246"
      fill="none"
      stroke="url(#limeGrad)"
      stroke-width="17"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Top-Right Plus (+) Badge -->
    <g transform="translate(356, 142)">
      <!-- Vertical Bar -->
      <rect x="-6" y="-20" width="12" height="40" rx="6" fill="url(#limeGrad)" />
      <!-- Horizontal Bar -->
      <rect x="-20" y="-6" width="40" height="12" rx="6" fill="url(#limeGrad)" />
    </g>

    <!-- 4. Mosque Dome & Spire with Crescent -->
    <!-- Dome Body -->
    <path
      d="M 212 238
         C 212 188, 238 174, 256 170
         C 274 174, 300 188, 300 238
         Z"
      fill="url(#creamGrad)"
    />

    <!-- Spire & Finial -->
    <rect x="254" y="162" width="4" height="10" rx="2" fill="#f8fafc" />
    <circle cx="256" cy="160" r="3.5" fill="#f8fafc" />

    <!-- Crescent Finial on Top of Dome -->
    <path
      d="M 256 138
         A 10 10 0 0 0 256 158
         A 8 8 0 0 1 256 142
         Z"
      fill="#f8fafc"
    />

    <!-- 5. Open Quran Book Foundation -->
    <!-- Book Base / Under Layer (Green Page Edges) -->
    <path
      d="M 256 298
         C 220 286, 178 288, 148 266
         L 164 286
         C 192 304, 228 302, 256 312
         C 284 302, 320 304, 348 286
         L 364 266
         C 334 288, 292 286, 256 298
         Z"
      fill="url(#bookGreenGrad)"
    />

    <!-- Open Book Left Page (Cream White) -->
    <path
      d="M 256 288
         C 220 274, 180 276, 150 252
         C 178 240, 222 242, 256 254
         Z"
      fill="url(#creamGrad)"
    />

    <!-- Open Book Right Page (Cream White) -->
    <path
      d="M 256 288
         C 292 274, 332 276, 362 252
         C 334 240, 290 242, 256 254
         Z"
      fill="url(#creamGrad)"
    />

    <!-- Book Spine Center Fold Accent -->
    <path
      d="M 256 254
         L 256 310"
      stroke="#cbd5e1"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.6"
    />
  </g>

  <!-- ==================== 6. WORDMARK "Zikr+" ==================== -->
  <g filter="url(#textShadow)">
    <!-- Custom hand-crafted geometric vectors for "Zikr" + "+" matching Pic 2 -->
    <!-- Z -->
    <path
      d="M 115 328
         H 178
         C 183 328, 186 331, 186 336
         C 186 340, 183 344, 178 347
         L 137 386
         H 180
         C 186 386, 190 390, 190 396
         C 190 402, 186 406, 180 406
         H 116
         C 111 406, 108 403, 108 398
         C 108 394, 111 390, 116 387
         L 157 348
         H 115
         C 109 348, 105 344, 105 338
         C 105 332, 109 328, 115 328
         Z"
      fill="#f8fafc"
    />

    <!-- i -->
    <!-- Dot of i -->
    <circle cx="211" cy="336" r="8.5" fill="#f8fafc" />
    <!-- Stem of i -->
    <path
      d="M 203 358
         C 203 352, 207 348, 212 348
         C 217 348, 221 352, 221 358
         V 396
         C 221 402, 217 406, 212 406
         C 207 406, 203 402, 203 396
         Z"
      fill="#f8fafc"
    />

    <!-- k -->
    <path
      d="M 238 330
         C 238 324, 242 320, 247 320
         C 252 320, 256 324, 256 330
         V 368
         L 282 352
         C 287 349, 293 351, 296 356
         C 299 361, 297 367, 292 370
         L 270 383
         L 294 397
         C 299 400, 300 406, 297 411
         C 294 416, 288 417, 283 414
         L 256 397
         V 398
         C 256 403, 252 407, 247 407
         C 242 407, 238 403, 238 398
         Z"
      fill="#f8fafc"
    />

    <!-- r -->
    <path
      d="M 314 358
         C 314 352, 318 348, 323 348
         C 328 348, 332 352, 332 358
         V 368
         C 338 356, 348 350, 360 351
         C 365 352, 369 356, 368 362
         C 367 367, 363 371, 357 370
         C 345 369, 334 376, 332 388
         V 396
         C 332 402, 328 406, 323 406
         C 318 406, 314 402, 314 396
         Z"
      fill="#f8fafc"
    />

    <!-- Plus (+) in Lime Green beside Zikr -->
    <g transform="translate(394, 376)">
      <!-- Vertical bar of + -->
      <rect x="-6.5" y="-23" width="13" height="46" rx="6.5" fill="url(#limeGrad)" />
      <!-- Horizontal bar of + -->
      <rect x="-23" y="-6.5" width="46" height="13" rx="6.5" fill="url(#limeGrad)" />
    </g>
  </g>
</svg>
