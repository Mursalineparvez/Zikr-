<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        // 1. Intercept Vite HMR WebSocket connection to prevent "WebSocket closed without opened" in Cloud Run proxy
        var NativeWebSocket = window.WebSocket;
        if (typeof NativeWebSocket !== 'undefined') {
          function MockViteHmrSocket(url, protocols) {
            var isHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            }

            if (!isHmr) {
              return new NativeWebSocket(url, protocols);
            }

            var emitter = new EventTarget();
            emitter.OPEN = 1;
            emitter.CLOSED = 3;
            emitter.CONNECTING = 0;
            emitter.CLOSING = 2;
            emitter.readyState = 1; // Mark as OPEN so Vite connects immediately
            emitter.binaryType = 'blob';
            emitter.protocol = 'vite-hmr';
            emitter.url = String(url);

            emitter.send = function() {};
            emitter.close = function() {
              emitter.readyState = 3;
              emitter.dispatchEvent(new Event('close'));
            };

            setTimeout(function() {
              if (typeof emitter.onopen === 'function') emitter.onopen(new Event('open'));
              emitter.dispatchEvent(new Event('open'));
            }, 0);

            return emitter;
          }

          MockViteHmrSocket.OPEN = 1;
          MockViteHmrSocket.CLOSED = 3;
          MockViteHmrSocket.CONNECTING = 0;
          MockViteHmrSocket.CLOSING = 2;
          MockViteHmrSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = MockViteHmrSocket;
        }

        // 2. Intercept benign browser notifications (WS close, audio interruption on pause/switch)
        function isIgnorableNotice(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('[vite]') !== -1 ||
            s.indexOf('the play() request was interrupted') !== -1 ||
            s.indexOf('interrupted by a call to pause') !== -1 ||
            s.indexOf('interrupted by a new load request') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function (e) {
          var errStr = (e.reason && (e.reason.message || e.reason.stack || '' + e.reason)) || '';
          if (isIgnorableNotice(errStr)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function (e) {
          var errStr = (e.message || (e.error && (e.error.message || e.error.stack)) || '') + '';
          if (isIgnorableNotice(errStr)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
          // Suppress benign offline chunk load errors to prevent app crash
          if (
            errStr.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            errStr.indexOf('Loading chunk') !== -1 ||
            errStr.indexOf('NetworkError') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);


        var origError = console.error;
        console.error = function() {
          if (isIgnorableNotice(arguments[0])) return;
          return origError.apply(console, arguments);
        };

        var origDebug = console.debug;
        console.debug = function() {
          if (isIgnorableNotice(arguments[0])) return;
          return origDebug.apply(console, arguments);
        };

        // 3. Early capture beforeinstallprompt so it is never dropped before React hooks mount
        window.__pwaInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__pwaInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        });
      })();
    </script>
    <title>Zikr+ - Digital Zikr PWA</title>

  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white overflow-x-hidden">
    <!-- Instant App Shell Splash Screen: Renders in 10ms before JS bundles execute, eliminating blank waiting screen -->
    <div id="root">
      <div id="app-initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#f8fafc;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;user-select:none;-webkit-tap-highlight-color:transparent;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <div style="position:absolute;width:104px;height:104px;border-radius:9999px;background:radial-gradient(circle, rgba(16,185,129,0.3) 0%, rgba(16,185,129,0) 70%);animation:splash-pulse 1.8s ease-in-out infinite;"></div>
          <div style="width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg, #064e3b 0%, #022c22 100%);border:1.5px solid rgba(16,185,129,0.4);box-shadow:0 12px 30px -8px rgba(16,185,129,0.4), inset 0 1px 1px rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;">
            <svg style="width:44px;height:44px;filter:drop-shadow(0 2px 8px rgba(16,185,129,0.5));" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="44" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 6"/>
              <circle cx="50" cy="50" r="32" fill="#047857" fill-opacity="0.6"/>
              <circle cx="50" cy="50" r="20" stroke="#34d399" stroke-width="3"/>
              <circle cx="50" cy="50" r="8" fill="#10b981"/>
            </svg>
          </div>
        </div>

        <div style="display:flex;align-items:baseline;gap:2px;margin-bottom:6px;">
          <span style="font-size:26px;font-weight:800;letter-spacing:0.5px;color:#f8fafc;">Zikr</span>
          <span style="font-size:28px;font-weight:900;color:#10b981;">+</span>
        </div>

        <div style="font-size:13px;color:#94a3b8;font-weight:500;margin-bottom:28px;letter-spacing:0.2px;">
          ডিজিটাল তাসবীহ ও ইসলামিক আমল
        </div>

        <!-- Lightweight glowing progress track -->
        <div style="width:130px;height:4px;background:rgba(30,41,59,0.8);border-radius:9999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:40%;background:linear-gradient(90deg, #059669, #34d399);border-radius:9999px;animation:splash-progress 1.2s ease-in-out infinite;"></div>
        </div>

        <div style="font-size:11px;color:#64748b;font-weight:500;margin-top:14px;letter-spacing:0.3px;">
          দ্রুত চালু হচ্ছে...
        </div>

        <style>
          @keyframes splash-pulse {
            0%, 100% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 0.85; }
          }
          @keyframes splash-progress {
            0% { left: -40%; width: 40%; }
            50% { left: 25%; width: 55%; }
            100% { left: 100%; width: 40%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
