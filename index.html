<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        // 1. Intercept Vite HMR WebSocket connection to prevent "WebSocket closed without opened" in Cloud Run proxy
        var NativeWebSocket = window.WebSocket;
        if (typeof NativeWebSocket !== 'undefined') {
          function MockViteHmrSocket(url, protocols) {
            var isHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            }

            if (!isHmr) {
              return new NativeWebSocket(url, protocols);
            }

            var emitter = new EventTarget();
            emitter.OPEN = 1;
            emitter.CLOSED = 3;
            emitter.CONNECTING = 0;
            emitter.CLOSING = 2;
            emitter.readyState = 1; // Mark as OPEN so Vite connects immediately
            emitter.binaryType = 'blob';
            emitter.protocol = 'vite-hmr';
            emitter.url = String(url);

            emitter.send = function() {};
            emitter.close = function() {
              emitter.readyState = 3;
              emitter.dispatchEvent(new Event('close'));
            };

            setTimeout(function() {
              if (typeof emitter.onopen === 'function') emitter.onopen(new Event('open'));
              emitter.dispatchEvent(new Event('open'));
            }, 0);

            return emitter;
          }

          MockViteHmrSocket.OPEN = 1;
          MockViteHmrSocket.CLOSED = 3;
          MockViteHmrSocket.CONNECTING = 0;
          MockViteHmrSocket.CLOSING = 2;
          MockViteHmrSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = MockViteHmrSocket;
        }

        // 2. Intercept benign browser notifications (WS close, audio interruption on pause/switch)
        function isIgnorableNotice(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('[vite]') !== -1 ||
            s.indexOf('the play() request was interrupted') !== -1 ||
            s.indexOf('interrupted by a call to pause') !== -1 ||
            s.indexOf('interrupted by a new load request') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function (e) {
          var errStr = (e.reason && (e.reason.message || e.reason.stack || '' + e.reason)) || '';
          if (isIgnorableNotice(errStr)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function (e) {
          var errStr = (e.message || (e.error && (e.error.message || e.error.stack)) || '') + '';
          if (isIgnorableNotice(errStr)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
          // Suppress benign offline chunk load errors to prevent app crash
          if (
            errStr.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            errStr.indexOf('Loading chunk') !== -1 ||
            errStr.indexOf('NetworkError') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);


        var origError = console.error;
        console.error = function() {
          if (isIgnorableNotice(arguments[0])) return;
          return origError.apply(console, arguments);
        };

        var origDebug = console.debug;
        console.debug = function() {
          if (isIgnorableNotice(arguments[0])) return;
          return origDebug.apply(console, arguments);
        };

        // 3. Early capture beforeinstallprompt so it is never dropped before React hooks mount
        window.__pwaInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__pwaInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        });
      })();
    </script>
    <title>Zikr+ - Digital Zikr PWA</title>

  <body class="bg-[#f8fafc] text-slate-900 antialiased selection:bg-[#007e8a] selection:text-white overflow-x-hidden">
    <!-- Instant App Shell Splash Screen: Renders in 10ms before JS bundles execute -->
    <div id="root">
      <div id="app-initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;color:#0f172a;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;user-select:none;-webkit-tap-highlight-color:transparent;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <div style="position:absolute;width:96px;height:96px;border-radius:9999px;background:radial-gradient(circle, rgba(0,126,138,0.2) 0%, rgba(0,126,138,0) 70%);animation:splash-pulse 1.8s ease-in-out infinite;"></div>
          <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg, #007e8a 0%, #005c65 100%);box-shadow:0 12px 28px -6px rgba(0,126,138,0.4);display:flex;align-items:center;justify-content:center;position:relative;">
            <svg style="width:38px;height:38px;fill:#ffffff;" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <svg style="position:absolute;width:20px;height:20px;color:#007e8a;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;" viewBox="0 0 24 24" fill="none">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
        </div>

        <div style="display:flex;align-items:baseline;gap:2px;margin-bottom:4px;">
          <span style="font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#0f172a;">Care</span>
          <span style="font-size:28px;font-weight:800;color:#007e8a;">Plus</span>
        </div>

        <div style="font-size:12px;color:#64748b;font-weight:600;margin-bottom:24px;letter-spacing:0.3px;">
          Your Health. Our Care
        </div>

        <!-- Lightweight glowing progress track -->
        <div style="width:120px;height:4px;background:#e2e8f0;border-radius:9999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:40%;background:linear-gradient(90deg, #007e8a, #14b8a6);border-radius:9999px;animation:splash-progress 1.2s ease-in-out infinite;"></div>
        </div>

        <style>
          @keyframes splash-pulse {
            0%, 100% { transform: scale(0.95); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0.7; }
          }
          @keyframes splash-progress {
            0% { left: -40%; width: 40%; }
            50% { left: 25%; width: 55%; }
            100% { left: 100%; width: 40%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
